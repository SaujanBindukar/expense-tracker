<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <!-- left column: branding -->
      <section class="brand">
        <div class="brand-inner">
          <h1>Expense Tracker</h1>
          <p>Track your expenses</p>
        </div>
      </section>

      <!-- right column: forms -->
      <section class="panel">
        <div class="panel-inner">
          <div class="tabs">
            <button type="button" class="tab active" data-target="login">Login</button>
            <button type="button" class="tab" data-target="signup">Sign Up</button>
          </div>

          <form id="login" class="form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required />

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Your password" required />

            <button type="submit" class="submit">Login</button>
          </form>

          <form id="signup" class="form hidden">
            <label for="signup-name">Name</label>
            <input type="text" id="signup-name" name="name" placeholder="Your name" required />

            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="you@example.com" required />

            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="At least 6 characters" required minlength="6" />

            <button type="submit" class="submit">Create account</button>
          </form>

          <p id="message" class="message"></p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
